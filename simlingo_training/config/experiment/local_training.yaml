# @package _global_
# Local training config (small-scale datasets) carla_bucket_v12_dreamer
defaults:
  - /data_module: carla_no_buckets
  - /model/vision_model: vlm 
  - /data_module/base_dataset: dataset

model:
  lr: 3e-5
  predict_route_as_wps: True
  speed_wps_mode: 2d
  language_model:
    variant: 'OpenGVLab/InternVL2-1B'
    lora: True
    lora_alpha: 32
    lora_r: 16
    lora_dropout: 0.1
  vision_model:
    variant: 'OpenGVLab/InternVL2-1B'

# data_module:
#   batch_size: 4  # Adjust based on GPU memory (8GB: 2, 16GB: 4-6)
#   num_workers: 4  # Adjust based on CPU cores
#   base_dataset:
#     # Dataset paths (relative to project root)
#     data_path: data/simlingo_dataset/database/simlingo_extracted
#     bucket_path: data/simlingo_dataset/database/bucketsv2_simlingo
#     pred_len: 11
#     cut_bottom_quarter: True
#     use_commentary: True
#     use_qa: True
#     qa_augmentation: True
#     img_shift_augmentation: True
#     img_shift_augmentation_prob: 0.5
#     hist_len: 1
#     route_as: target_point_command
#     use_lmdrive_commands: True
#     use_old_towns: True
#     use_town13: True
#     use_safety_flag: True

data_module:
  batch_size: 6  # Adjust based on GPU memory (8GB: 2, 16GB: 4-6)
  num_workers: 4  # Adjust based on CPU cores
  dreamer_dataset: null  # Disable dreamer (no dreamer directory in this dataset)
  base_dataset:
    # Dataset paths (relative to project root)
    data_path: data/simlingo_dataset/database/simlingo_extracted
    bucket_path: data/simlingo_dataset/database/bucketsv2_simlingo
    pred_len: 11
    cut_bottom_quarter: True
    use_commentary: False
    use_qa: False
    qa_augmentation: False
    img_shift_augmentation: True
    img_shift_augmentation_prob: 0.5
    hist_len: 1
    route_as: command
    use_lmdrive_commands: False
    use_old_towns: True
    use_town13: True
    use_safety_flag: True
    use_cfg: True  # Whether to enable CFG (Classifier-Free Guidance)
    cfg_dropout_prob: 0.20  # Probability of dropping command during CFG training (0.0-1.0)

max_epochs: 5
val_every_n_epochs: 2

gpus: 1  # Single-GPU training
seed: 42
name: local_training
enable_wandb: true

hydra:
  run:
    dir: outputs/${wandb_name}_${name}
